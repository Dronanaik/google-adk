[project]
name = "csm-voice-agent"
version = "0.1.0"
description = "A live Customer Service Management (CSM) Voice Agent powered by Google ADK and the Gemini Live API."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "google-genai>=1.20",
    "python-dotenv>=1.0",
    "websockets>=13",
    "google-adk>=2.2",
]

[tool.uv]
package = false

